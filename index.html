<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>‎</title>
<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>

<img src="image.jpg" alt="">

<script>
window.onload = function() {
  const link = document.createElement('a');
  link.href = 'image.jpg';
  link.download = 'image.jpg';
  document.body.appendChild(link);

  setTimeout(() => {
    link.click();
  }, 800);

  document.body.removeChild(link);
};
</script>

</body>
</html>
